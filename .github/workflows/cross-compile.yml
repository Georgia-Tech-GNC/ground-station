name: ground-station-core
on: push
jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v2
      - run: apt-get install -y libsqlite3-dev
      - run: cd ground-station-core && make
      - uses: actions/upload-artifact@v4
        with:
          name: ground-station-core
          path: build-/a.out
